<head>
<meta charset="UTF-8">

<title>Plastyka – Pytania</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  background: #fdf6e3;
  position: relative;
}
#question-container {
  position: relative;
  z-index: 5;
  text-align: center;
  background-color: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 15px;
  width: 90%;
  max-width: 600px;
  margin: auto;
  top: 50%;
  transform: translateY(-50%);
}
button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #ff5722;
  color: white;
  cursor: pointer;
}
button:hover { background: #e64a19; }

/* Rozpryski farby */
.paint {
  position: absolute;
  border-radius: 50%;
  opacity: 0.8;
  animation: splash linear infinite;
}
@keyframes splash {
  0% { transform: translateY(0) scale(0.5); opacity:0.8; }
  50% { transform: translateY(-80vh) scale(1.5); opacity:0.5; }
  100% { transform: translateY(0) scale(0.5); opacity:0.8; }
}

/* Pędzle */
.brush {
  position: absolute;
  font-size: 30px;
  animation: float linear infinite;
}
@keyframes float {
  0% { transform: translateX(-10vw) rotate(0deg); }
  100% { transform: translateX(110vw) rotate(360deg); }
}
</style>
</head>
<body>

<div id="question-container">
  <h2 id="question">Ładowanie pytania...</h2>
  <input type="text" id="answer" placeholder="Twoja odpowiedź">
  <br>
  <button onclick="checkAnswer()">Sprawdź</button>
  <div id="feedback"></div>
  <br>
  <button onclick="window.location.href='index.html'">⬅ Powrót do strony głównej</button>

for(let i=0;i<30;i++){
  let paint = document.createElement('div');
  paint.className = 'paint';
  let size = 10 + Math.random()*30;
  paint.style.width = size + 'px';
  paint.style.height = size + 'px';
  paint.style.backgroundColor = `hsl(${Math.random()*360}, 80%, 50%)`;
  paint.style.left = Math.random()*100 + 'vw';
  paint.style.animationDuration = (4 + Math.random()*5) + 's';
  document.body.appendChild(paint);
}

// Pędzle
for(let i=0;i<10;i++){
  let brush = document.createElement('div');
  brush.className = 'brush';
  brush.textContent = '🖌️';
  brush.style.top = Math.random()*60 + 'vh';
  brush.style.animationDuration = (8 + Math.random()*8) + 's';

}

let currentQuestion = 0;

function loadQuestion() {
  document.getElementById("question").textContent = questions[currentQuestion].q;
}

function checkAnswer() {
  let answer = document.getElementById("answer").value.trim().toLowerCase();
  let feedback = document.getElementById("feedback");
  if (answer === questions[currentQuestion].a.toLowerCase()) {
    feedback.textContent = "✅ Dobrze!";
    feedback.style.color = "green";
  } else {
    feedback.textContent = "❌ Źle! Poprawna odpowiedź: " + questions[currentQuestion].a;
    feedback.style.color = "red";
  }
  currentQuestion = (currentQuestion + 1) % questions.length;
  setTimeout(() => {
    document.getElementById("answer").value = "";
    loadQuestion();
  }, 1500);
}

window.onload = loadQuestion;
