<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(#a0d8f1, #ffffff);
  position: relative;
}
#question-container {
  position: relative;
  z-index: 5;
  text-align: center;
  background-color: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 15px;
  width: 90%;
  max-width: 600px;
  margin: auto;
  top: 50%;
  transform: translateY(-50%);
}
button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #f44336;
  color: white;
  cursor: pointer;
}
button:hover { background: #d32f2f; }

/* Animacja biegaczy */
.runner {
  position: absolute;
  font-size: 30px;
  animation: run linear infinite;
}
@keyframes run {
  0% { transform: translateX(-10vw); }
  100% { transform: translateX(110vw); }
}

/* Animacja piłek, lotek i rakietek */
.sports {
  position: absolute;
  font-size: 25px;
  animation: floatSports linear infinite;
}
@keyframes floatSports {
  0% { transform: translateY(100vh) rotate(0deg); }
  100% { transform: translateY(-10vh) rotate(360deg); }
}
</style>
</head>

<div id="question-container">

  runner.style.top = (10 + Math.random()*70) + 'vh';

let currentQuestion = 0;

function loadQuestion() {
  document.getElementById("question").textContent = questions[currentQuestion].q;
}

function checkAnswer() {
  let answer = document.getElementById("answer").value.trim().toLowerCase();
  let feedback = document.getElementById("feedback");
  if (answer === questions[currentQuestion].a.toLowerCase()) {
    feedback.textContent = "✅ Dobrze!";
    feedback.style.color = "green";
  } else {
    feedback.textContent = "❌ Źle! Poprawna odpowiedź: " + questions[currentQuestion].a;
    feedback.style.color = "red";
  }
  currentQuestion = (currentQuestion + 1) % questions.length;
  setTimeout(() => {
    document.getElementById("answer").value = "";
    loadQuestion();
  }, 1500);
}

window.onload = loadQuestion;
