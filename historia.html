      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;

    #feedback {

      font-size: 18px;
      font-weight: bold;
    }
    /* animacje – np. lecące pergaminy */
    .scroll {
      position: absolute;
      width: 40px;
      height: 60px;
      background: #deb887;
      border: 2px solid #8b4513;
      border-radius: 5px;
      animation: fall linear infinite;
      opacity: 0.7;
    }
    @keyframes fall {

      100% { transform: translateY(110vh) rotate(360deg); }

    let currentQuestion;

    function getRandomQuestion() {
      const randomIndex = Math.floor(Math.random() * questions.length);
      currentQuestion = questions[randomIndex];
      document.getElementById("question").textContent = currentQuestion.q;
      document.getElementById("answer").value = "";
      document.getElementById("feedback").textContent = "";
    }

    function checkAnswer() {
      const userAnswer = document.getElementById("answer").value.trim();
      if(userAnswer.toLowerCase() === currentQuestion.a.toLowerCase()) {
        document.getElementById("feedback").textContent = "✅ Dobrze!";
        document.getElementById("feedback").style.color = "green";
      } else {
        document.getElementById("feedback").textContent = "❌ Źle! Poprawna odpowiedź: " + currentQuestion.a;
        document.getElementById("feedback").style.color = "red";
      }
      setTimeout(getRandomQuestion, 2000);
    }

    // Animacje – pergaminy
    function createScroll() {
      const scroll = document.createElement("div");
      scroll.classList.add("scroll");
      scroll.style.left = Math.random() * window.innerWidth + "px";
      scroll.style.animationDuration = (5 + Math.random() * 5) + "s";
      document.body.appendChild(scroll);
      setTimeout(() => scroll.remove(), 10000);
    }
