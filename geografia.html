<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geografia – Pytania</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(#87ceeb, #ffffff);
  position: relative;
}
#question-container {
  position: relative;
  z-index: 5;
  text-align: center;
  background-color: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 15px;
  width: 90%;
  max-width: 600px;
  margin: auto;
  top: 50%;
  transform: translateY(-50%);
}
button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #2196f3;
  color: white;
  cursor: pointer;
}
button:hover { background: #1565c0; }

/* Globusy */
.globe {
  position: absolute;
  font-size: 30px;
  animation: spin 8s linear infinite;
  opacity: 0.7;
}
@keyframes spin {
  0% { transform: translateY(0) rotate(0deg); opacity:0.7; }
  50% { transform: translateY(-80vh) rotate(180deg); opacity:1; }
  100% { transform: translateY(0) rotate(360deg); opacity:0.7; }
}

/* Chmury */
.cloud {
  position: absolute;
  font-size: 50px;
  animation: float linear infinite;
  opacity: 0.5;
}
@keyframes float {
  0% { transform: translateX(-10vw); }
  100% { transform: translateX(110vw); }
}

/* Samoloty */
.plane {
  position: absolute;
  font-size: 25px;
  animation: fly linear infinite;
}
@keyframes fly {
  0% { transform: translate(-10vw, 20vh) rotate(0deg); }
  50% { transform: translate(110vw, 40vh) rotate(20deg); }
  100% { transform: translate(-10vw, 20vh) rotate(0deg); }
}

/* Pulsujące punkty */
.marker {
  position: absolute;
  font-size: 20px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0% { transform: scale(1); opacity:1; }
  50% { transform: scale(1.5); opacity:0.6; }
  100% { transform: scale(1); opacity:1; }
}
</style>
</head>
<body>

<div id="question-container">
  <h2 id="question">Ładowanie pytania...</h2>
  <input type="text" id="answer" placeholder="Twoja odpowiedź">
  <br>

  <div id="feedback"></div>
  <br>
  <button onclick="window.location.href='index.html'">⬅ Powrót do strony głównej</button>

for(let i=0; i<10; i++){

  globe.style.left = Math.random()*100 + 'vw';
  globe.style.animationDuration = (6 + Math.random()*5) + 's';
  document.body.appendChild(globe);
}

// Chmury
for(let i=0; i<8; i++){
  let cloud = document.createElement('div');
  cloud.className = 'cloud';
  cloud.textContent = '☁️';
  cloud.style.top = Math.random()*50 + 'vh';
  cloud.style.animationDuration = (15 + Math.random()*20) + 's';
  document.body.appendChild(cloud);
}

// Samoloty
for(let i=0; i<5; i++){
  let plane = document.createElement('div');
  plane.className = 'plane';
  plane.textContent = '✈️';
  plane.style.animationDuration = (10 + Math.random()*10) + 's';
  plane.style.top = (10 + Math.random()*40) + 'vh';

let currentQuestion = 0;

function loadQuestion() {
  document.getElementById("question").textContent = questions[currentQuestion].q;
}

function checkAnswer() {
  let answer = document.getElementById("answer").value.trim().toLowerCase();
  let feedback = document.getElementById("feedback");
  if (answer === questions[currentQuestion].a.toLowerCase()) {
    feedback.textContent = "✅ Dobrze!";
    feedback.style.color = "green";
  } else {
    feedback.textContent = "❌ Źle! Poprawna odpowiedź: " + questions[currentQuestion].a;
    feedback.style.color = "red";
  }
  currentQuestion = (currentQuestion + 1) % questions.length;
  setTimeout(() => {
    document.getElementById("answer").value = "";
    loadQuestion();
  }, 1500);
}

window.onload = loadQuestion;
</script>
