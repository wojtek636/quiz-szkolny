<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematyka</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    position: relative;
}

#question-container {
    position: relative;
    z-index: 10;
    text-align: center;
    background-color: rgba(255,255,255,0.85);
    padding: 30px;
    border-radius: 15px;
}

.question {
    font-size: 24px;
    margin-bottom: 20px;
}

input {
    padding: 10px;
    font-size: 18px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
    margin-left: 10px;
}

button:hover {
    background-color: #45a049;
}

#result {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}

/* Animacje tła */
.star, .symbol, .balloon {
    position: absolute;
    z-index: 1;
    pointer-events: none;
}

.star {
    width: 5px;
    height: 5px;
    background: yellow;
    border-radius: 50%;
    animation: fall 5s linear infinite;
}

.symbol {
    font-size: 20px;
    color: #ff6666;
    animation: float 6s linear infinite;
}

.balloon {
    width: 20px;
    height: 30px;
    background-color: #ff3399;
    border-radius: 50% 50% 50% 50%;
    animation: rise 7s linear infinite;
}

@keyframes fall {
    0% {top: -10px;}
    100% {top: 100vh;}
}

@keyframes float {
    0% {top: -20px; transform: rotate(0deg);}
    100% {top: 100vh; transform: rotate(360deg);}
}

@keyframes rise {
    0% {bottom: -30px;}
    100% {bottom: 100vh;}
}
</style>
</head>
<body>

<div id="question-container">
    <div class="question" id="question">Pytanie</div>
    <input type="number" id="answer" placeholder="Twoja odpowiedź">
    <button onclick="checkAnswer()">Sprawdź</button>
    <div id="result"></div>
    <a href="index.html">⬅ Powrót do strony głównej</a>
</div>

let currentQuestion;

function getRandomQuestion() {
    const index = Math.floor(Math.random() * questions.length);
    currentQuestion = questions[index];
    document.getElementById('question').textContent = currentQuestion.q;
    document.getElementById('answer').value = "";
    document.getElementById('result').textContent = "";
}

function checkAnswer() {
    const userAnswer = document.getElementById('answer').value;
    const result = document.getElementById('result');
    if(userAnswer == currentQuestion.a) {
        result.textContent = "🎉 Brawo! Poprawna odpowiedź!";
        result.style.color = "green";
        getRandomQuestion();
    } else {
        result.textContent = "❌ Niepoprawnie, spróbuj jeszcze raz.";
        result.style.color = "red";
    }
}

getRandomQuestion();

// Animacje tła
function createStar() {
    const star = document.createElement('div');
    star.classList.add('star');
    star.style.left = Math.random() * window.innerWidth + 'px';
    star.style.animationDuration = 3 + Math.random() * 3 + 's';
    document.body.appendChild(star);
    setTimeout(()=>{ star.remove(); }, 6000);
}

function createSymbol() {
    const symbols = ['+', '-', '×', '÷'];
    const symbol = document.createElement('div');
    symbol.classList.add('symbol');
    symbol.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    symbol.style.left = Math.random() * window.innerWidth + 'px';
    symbol.style.animationDuration = 3 + Math.random() * 3 + 's';
    document.body.appendChild(symbol);
    setTimeout(()=>{ symbol.remove(); }, 6000);
}

function createBalloon() {
    const balloon = document.createElement('div');
    balloon.classList.add('balloon');
    balloon.style.left = Math.random() * window.innerWidth + 'px';
    balloon.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);
    document.body.appendChild(balloon);
    setTimeout(()=>{ balloon.remove(); }, 7000);
}

// Generowanie animacji co 300ms
setInterval(createStar, 300);
setInterval(createSymbol, 500);
setInterval(createBalloon, 1000);

</script>
</body>
</html>
